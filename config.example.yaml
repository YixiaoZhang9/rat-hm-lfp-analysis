paths:
  # Project root containing Rat_HM_Ephys_TD_Analysis_R1_8 for R1-4 and R5-8.
  R1_8_root: /path/to/Rat_HM_Ephys_TD

  # Project root containing Rat_HM_Ephys_TD_Analysis_R9_16 for R9-12 and R13-16.
  R9_16_root: /path/to/Rat_HM_Ephys_TD

  # Project root used by raw OpenEphys and sleep-scoring input scripts.
