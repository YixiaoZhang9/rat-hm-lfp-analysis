  event_cache_root: /path/to/wave_cache

  # Session map and HC / Training day grid for rats 1-16
  session_map_csv: /path/to/rat_sessions_HC_S1-5.csv
  day_grid_xlsx: /path/to/Rats_1-16__HC_vs_Training_days__.xlsx
